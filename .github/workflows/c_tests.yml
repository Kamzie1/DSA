name: Test C code

on:
  push:
    branches:
      - c
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  test-and-merge:
    if: >
      github.event_name == 'push' || 
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'c')
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Run make tests
        run: cd c && make test MODE=debug
